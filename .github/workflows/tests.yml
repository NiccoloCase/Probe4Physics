name: CPU validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install hydra-core==1.3.2 pandas pyarrow pyyaml numpy matplotlib scipy scikit-learn huggingface_hub
      - name: Test retained workflows
        run: python -m unittest discover -s tests -q
      - name: Verify paper inputs and command interface
        run: |
          python scripts/verify_release_inputs.py
          python run.py help
          python run.py exp.list
          python run.py health.layers strict_exit=true
